name: Update README Assets

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4

      - name: Make assets folder
        run: mkdir -p assets

      # --- Stats & Top Languages ---
      - name: Generate GitHub Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=rezwan-ahmed-l7&show_icons=true&theme=transparent&hide_border=true&bg_color=00000000&title_color=3B82F6&text_color=3B82F6&icon_color=3B82F6
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=rezwan-ahmed-l7&layout=compact&theme=transparent&hide_border=true&bg_color=00000000&title_color=3B82F6&text_color=3B82F6&langs_count=8
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --- Streak ---
      - name: Fetch Streak Stats (validated)
        run: |
          curl -s "https://streak-stats.demolab.com/?user=rezwan-ahmed-l7&theme=transparent&hide_border=true" -o /tmp/streak.svg
          if grep -q "<svg" /tmp/streak.svg; then
            mv /tmp/streak.svg assets/streak.svg
            echo "Streak updated."
          else
            echo "Streak service returned invalid content — keeping previous file."
          fi

      # --- Activity Graph: ephemeral self-host ---
      - name: Checkout github-readme-activity-graph source
        uses: actions/checkout@v4
        with:
          repository: Ashutosh00710/github-readme-activity-graph
          path: activity-graph-src

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install and build
        working-directory: activity-graph-src
        run: |
          npm install
          npm run build

      - name: Start the server in background
        working-directory: activity-graph-src
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PORT: 5100
        run: |
          nohup node dist/main.js > server.log 2>&1 &
          echo $! > server.pid
          sleep 8
          echo "=== Server log ==="
          cat server.log

      - name: Fetch activity graph from local server
        run: |
          curl -s "http://localhost:5100/graph?username=rezwan-ahmed-l7&color=58A6FF&line=1F6FEB&point=58A6FF&bg_color=00000000&hide_border=true&custom_title=Contribution%20Graph" -o /tmp/activity-graph.svg
          if grep -q "<svg" /tmp/activity-graph.svg; then
            mv /tmp/activity-graph.svg assets/activity-graph.svg
            echo "Activity graph updated successfully."
          else
            echo "Failed to get valid SVG. Response was:"
            cat /tmp/activity-graph.svg
            echo "Keeping previous file if exists."
          fi

      - name: Stop the background server
        working-directory: activity-graph-src
        if: always()
        run: kill $(cat server.pid) || true

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: refresh README assets" && git push)
