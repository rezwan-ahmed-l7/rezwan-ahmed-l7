name: Update README Assets

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:         # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Make assets folder
        run: mkdir -p assets

      # --- Stats & Top Languages: generated locally via the maintained Action ---
      # The old public API (github-readme-stats.vercel.app) is no longer maintained
      # and its public instance has been repeatedly paused/down. This Action runs
      # the same renderer directly in this workflow using GITHUB_TOKEN — no PAT,
      # no external Vercel dependency, no rate-limit sharing with other users.
      - name: Generate GitHub Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=rezwan-ahmed-l7&show_icons=true&theme=transparent&hide_border=true&bg_color=00000000&title_color=3B82F6&text_color=3B82F6&icon_color=3B82F6
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=rezwan-ahmed-l7&layout=compact&theme=transparent&hide_border=true&bg_color=00000000&title_color=3B82F6&text_color=3B82F6&langs_count=8
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --- Streak & Activity Graph: still fetched from their public instances, ---
      # but now validated before overwriting. If either service is briefly down
      # or rate-limited, curl would otherwise save the error page as a fake ".svg" —
      # this check keeps last night's good file instead of replacing it with garbage.
      - name: Fetch Streak Stats (validated)
        run: |
          curl -s "https://streak-stats.demolab.com/?user=rezwan-ahmed-l7&theme=transparent&hide_border=true" -o /tmp/streak.svg
          if grep -q "<svg" /tmp/streak.svg; then
            mv /tmp/streak.svg assets/streak.svg
            echo "Streak card updated."
          else
            echo "Streak service returned invalid content — keeping previous file."
          fi

      - name: Fetch Activity Graph (validated)
        run: |
          curl -s "https://github-readme-activity-graph.vercel.app/graph?username=rezwan-ahmed-l7&theme=github-dark&hide_border=true&bg_color=00000000" -o /tmp/activity-graph.svg
          if grep -q "<svg" /tmp/activity-graph.svg; then
            mv /tmp/activity-graph.svg assets/activity-graph.svg
            echo "Activity graph updated."
          else
            echo "Activity graph service returned invalid content — keeping previous file."
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: refresh README assets" && git push)
